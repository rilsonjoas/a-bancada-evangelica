name: Deploy VPS

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-vps
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - name: Deploy no VPS (git pull + rebuild)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/a-bancada-evangelica
            git pull --ff-only origin main
            cd ~/hetzner-infra
            make deploy service=bancada
            # Prevenção de incidente (2026-08-22): o disco do VPS encheu
            # (100%) com cache de build acumulado dos deploys — o Postgres
            # compartilhado crashou com "No space left on device" e entrou
            # em crash-loop. O docker builder prune NÃO roda sozinho.
            # Mantém cache da última semana; descarta o resto.
            docker builder prune -f --filter "until=168h"

      - name: Smoke test
        run: |
          # Achado 2026-08-16 nos outros 4 projetos, replicado aqui
          # (esse tinha ficado de fora): "sleep 3" fixo dava
          # falso-negativo (container ainda reiniciando) mesmo com
          # deploy real funcionando. Retry até 10x com 3s entre elas.
          for i in $(seq 1 10); do
            curl -sf -o /dev/null https://api-bancada.narniano.com/health && break
            [ "$i" -eq 10 ] && exit 1
            sleep 3
          done
