name: Deploy VPS

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-vps
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - name: Deploy no VPS (git pull + rebuild)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            # Guarda de disco (incidentes 2026-08-22 e 2026-08-23): se a raiz
            # estiver >=90%, aborta ANTES de piorar tudo com mais um build.
            USO=$(df --output=pcent / | tail -1 | tr -dc '0-9')
            if [ "$USO" -ge 90 ]; then
              echo "❌ Abortado: disco em ${USO}% (limite 90%). Rode: docker builder prune -af"
              exit 1
            fi
            cd /opt/a-bancada-evangelica
            git pull --ff-only origin main
            # Achado 2026-08-24: deploys verdes com código VELHO — o git pull
            # falhava, o erro era engolido (sem set -e), o rebuild subia código
            # antigo e o smoke test passava (/health serve em qualquer versão).
            # Agora: pull tem que chegar EXATAMENTE no commit deste push.
            ATUAL=$(git rev-parse HEAD)
            if [ "$ATUAL" != "${{ github.sha }}" ]; then
              echo "❌ VPS em $ATUAL, esperado ${{ github.sha }} — pull não aplicou."
              exit 1
            fi
            cd ~/hetzner-infra
            make deploy service=bancada
            # Prevenção de reincidência: o filtro semanal (until=168h) NÃO pegava
            # rajadas — 7 pushes em 2h geraram 4,4GB de cache novo. E o prune
            # SIMPLES (-f) deixa de fora registros compartilhados: achado real
            # (2026-08-23), docker system df acusava 17,9GB em cache MESMO após
            # um prune -f ter rodado. O -a limpa tudo; custo = rebuild seguinte
            # sem cache de camada (segundos a mais, irrelevante neste porte).
            docker builder prune -af >/dev/null
            docker image prune -f >/dev/null
            USO=$(df --output=pcent / | tail -1 | tr -dc '0-9')
            echo "✅ Deploy ok — disco em ${USO}%"

      - name: Smoke test
        run: |
          # Achado 2026-08-16 nos outros 4 projetos, replicado aqui
          # (esse tinha ficado de fora): "sleep 3" fixo dava
          # falso-negativo (container ainda reiniciando) mesmo com
          # deploy real funcionando. Retry até 10x com 3s entre elas.
          for i in $(seq 1 10); do
            curl -sf -o /dev/null https://api-bancada.narniano.com/health && break
            [ "$i" -eq 10 ] && exit 1
            sleep 3
          done
