name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      # Fecha a porta do incidente tela-branca de 2026-08-23 (rota sem
      # import passou por lint/testes/build). tsc simples NÃO serve —
      # tsconfig solution-style não checa nada; usar -p por projeto.
      - name: Typecheck (app + api)
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

      # Guarda-roupa anti-dados-fabricados (regra "0 honesto > número
      # fabricado"): qualquer FALLBACK_*/generateFallback/MOCK_* com conteúdo
      # sintético reacendido nos hooks/pages derruba o CI. Os mocks de
      # testes vivem em __tests__ (excluídos via glob).
      - name: No fabricated data fallbacks
        run: |
          # Pega só onde os dados são realmente CRIADOS ou CHAMADOS
          if rg -n -g '!**/__tests__/**' -g '!**/*.test.ts' -g '!**/*.test.tsx' '(const\s+FALLBACK_|function\s+generateFallback|const\s+MOCK_[A-Z])' src/hooks src/pages src/data; then
            echo "::error::Dados fabricados detectados: fallbacks sintéticos em UI não são permitidos (regra '0 honesto > número fabricado')."
            exit 1
          fi
          echo "Sem fallbacks fabricados — OK."

  boot-smoke:
    name: Smoke test de boot (browser)
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (produção)
        run: pnpm build

      - name: Install Playwright (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Sobe o preview do build
        run: |
          pnpm preview --port 4173 > /tmp/preview.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:4173/; then break; fi
            sleep 1
          done
          echo "preview pid=$PID"
        env:
          # IA: sem DB real — o preview do SPA serve o HTML estático; os
          # erros de runtime (ex.: TDZ do recharts) aparecem no browser
          # mesmo sem a API. É exatamente isso que o smoke test quer pegar.
          VITE_API_URL: http://localhost:4173/api-none

      - name: Roda o smoke test de boot
        run: npx playwright test e2e/boot-smoke.spec.ts --config=playwright.config.ts
        env:
          E2E_BOOT_URL: http://localhost:4173

  docker-api:
    name: Build & Push API
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bancada-api
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-analysis:
    name: Build & Push Analysis
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bancada-analysis
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: analysis
          file: analysis/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
